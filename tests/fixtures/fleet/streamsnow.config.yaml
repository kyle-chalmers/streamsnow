# Anonymized fixture fleet: three Acme apps shaped like a real production
# monorepo (narrative phase notes, a pipeline-shipped config.toml, a waived
# session fallback, brace-less token headers, nested page packages).
# tests/test_validate.py::test_fleet_fixture_app_passes_validate is the
# regression net for 'faithful to a real fleet'.
schema_version: 2
runtime: container
project:
  name: Acme Fleet
  slug: acme-fleet
snowflake:
  account: ab12345.us-east-1
  connection_name: acme
  objects:
    app_database: STREAMSNOW_APPS
    app_schema: DASHBOARDS
    stage_database: STREAMSNOW_APPS
    stage_schema: DASHBOARDS
    stage_name: STREAMSNOW_CODE_STAGE
    default_warehouse: STREAMSNOW_WH
    allowed_warehouses:
    - STREAMSNOW_WH
    compute_pool: STREAMLIT_POOL
    external_access_integration: PYPI_ACCESS_INTEGRATION
  roles:
    ci_role: STREAMSNOW_DEPLOY_ROLE
    viewer_role: STREAMSNOW_VIEWER_ROLE
governance:
  sources:
  - ANALYTICS_DB.ANALYTICS
  - ANALYTICS_DB.REPORTING
  app_data: STREAMSNOW_APPS.STREAMSNOW_REPORTING
  schema_deny:
  - RAW
  - STAGING
  - BRIDGE
  read_exceptions: []
  boundary: warn
deploy:
  source: stage-copy
  artifact_exclude:
  - .streamlit/config.toml
brand:
  theme:
    primary: '#3B82F6'
    background: '#FFFFFF'
  chart_sequence:
  - '#3B82F6'
  - '#10B981'
  - '#F59E0B'
  - '#EF4444'
  - '#8B5CF6'
sql_review:
  coverage: warn
review_gate:
  enabled: true
