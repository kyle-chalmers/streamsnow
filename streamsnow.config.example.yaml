# streamsnow.config.yaml — single source of truth for your StreamSnow repo.
# Copy to `streamsnow.config.yaml` and edit, or run `streamsnow init` to generate.
# SECRETS NEVER GO HERE (Snowflake key/PAT, etc. live in CI secrets / secrets.toml).

schema_version: 2

# container = cheaper, full PyPI, modern Streamlit (default).
# warehouse = legacy: instant start, Anaconda channel, no compute pool/EAI.
runtime: container

# Default @st.cache_data TTL (seconds) written into AGENTS.md and the starter page.
# cache_ttl: 1800

project:
  name: "Acme Dashboards"
  slug: "acme-dashboards"

snowflake:
  account: "ab12345.us-east-1"        # LOCATOR only — NOT the full hostname
  connection_name: "acme"             # name of your `snow` CLI connection

  objects:
    # Where the deployed STREAMLIT objects live:
    app_database: "STREAMSNOW_APPS"
    app_schema: "DASHBOARDS"
    # Internal stage for stage-copy deploys (CI pushes app source here):
    stage_database: "STREAMSNOW_APPS"
    stage_schema: "DASHBOARDS"
    stage_name: "STREAMSNOW_CODE_STAGE"
    # Warehouse the apps query with:
    default_warehouse: "STREAMSNOW_WH"
    allowed_warehouses: ["STREAMSNOW_WH"]
    # Container-runtime only (omit/blank for warehouse runtime). SYSTEM_COMPUTE_POOL_CPU is
    # pre-provisioned in every account, so deploy-setup --admin never creates it; name your
    # own pool here only if you want dedicated nodes (one app per node).
    compute_pool: "SYSTEM_COMPUTE_POOL_CPU"
    external_access_integration: "PYPI_ACCESS_INTEGRATION"
    # Container runtime image and the Python version local venvs pin to (defaults shown):
    # runtime_name: "SYSTEM$ST_CONTAINER_RUNTIME_PY3_11"
    # container_python: "3.11"

  roles:
    ci_role: "STREAMSNOW_DEPLOY_ROLE"      # deploy/owner role used by CI
    viewer_role: "STREAMSNOW_VIEWER_ROLE"  # role granted USAGE on each app; preview role

governance:
  # Report-ready data your apps read, as DATABASE.SCHEMA, in any databases.
  # deploy-setup --admin grants the CI role read on exactly these, and app SQL
  # names objects in full (DATABASE.SCHEMA.OBJECT).
  sources: ["ANALYTICS_DB.ANALYTICS", "ANALYTICS_DB.REPORTING"]
  # The one schema per repo for views and dynamic tables built for the apps
  # (default <app_database>.STREAMSNOW_REPORTING); deploy-setup --admin creates it.
  app_data: "STREAMSNOW_APPS.STREAMSNOW_REPORTING"
  # Never queried by app code: RAW blocks a RAW schema in every database,
  # FINANCE.RAW only in that database.
  schema_deny: ["RAW", "STAGING", "BRIDGE"]
  read_exceptions: []                  # exact objects readable despite schema_deny,
                                       # e.g. "ANALYTICS_DB.RAW.CALENDAR_DIM"
  # Shared (Marketplace or data-share) databases holding sources take IMPORTED
  # PRIVILEGES instead of per-schema grants. SNOWFLAKE and SNOWFLAKE_SAMPLE_DATA
  # are built in.
  # imported_databases: ["PARTNER_SHARE"]
  boundary: warn                       # warn (default): names outside sources and
                                       # app_data, and two-part names, are reported.
                                       # enforce: they fail schema-refs, validate-app, CI.

deploy:
  source: "stage-copy"                 # stage-copy (default) | git-repository
  # git-repository only:
  # git_repository_fqn: "STREAMSNOW_APPS.DASHBOARDS.STREAMLIT_REPO"
  # git_branch: "main"
  # git_origin: "https://github.com/acme/acme-dashboards"   # the repo Snowflake fetches from
  # api_integration_name: "GITHUB_API_INTEGRATION"
  # secret_name: "STREAMSNOW_APPS.DASHBOARDS.GITHUB_PAT_SECRET"
  # github_auth_mode: "pat"            # pat | github-app (same setup as pat) | public (no secret)
  # Files your deploy pipeline ships by another step and so may be left out of
  # each app's snowflake.yml artifacts:. Exact relative paths, non-code only
  # (.toml/.md/.txt/images); pages/, queries/ and *.py/*.sql are never excludable.
  # artifact_exclude: [".streamlit/config.toml"]

brand:                                 # optional — neutral defaults if omitted
  theme:
    primary: "#3B82F6"
    background: "#FFFFFF"
  # Categorical series colors, in order. Keep status hues (green/amber/red) out:
  # they mean good/warning/bad. A dark theme needs its own colorblind-checked set.
  chart_sequence: ["#2A78D6", "#EB6834", "#1BAF7A", "#4A3AA7", "#E87BA4"]

sql_review:                            # optional — the runnable review SQL gate
  coverage: warn                       # warn (default): a page or query missing from an app's
                                       # sql_review/index.yaml is reported, not failed — gives
                                       # an adopting fleet time to backfill. fail: it fails
                                       # validate-app, pre-commit and CI. Drift, hand edits,
                                       # marker mismatches and lint always fail.

review_gate:                           # optional — the warn-only Stop-hook nudge
  enabled: true                        # false disables the nudge repo-wide
  # apps_dir: "apps"                   # only if your apps live elsewhere
  # base_ref: "origin/main"            # ref changes are classified against
