# Weekly, grouped dependency updates. Major bumps get their own PR so a breaking upstream
# release is never hidden inside a group. claude-autopilot (.github/workflows) squash-merges
# uv.lock-only updates once CI is green on a head up to date with main, after a Claude
# review of any major bump. Updates that touch pyproject.toml or workflows wait for the
# maintainer.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type:chore", "area:plugin"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
