# Weekly, grouped dependency updates. Nothing auto-merges: the maintainer merges after CI
# and claude-review pass. Major bumps get their own PR so a breaking upstream release is
# never hidden inside a group.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type:chore", "area:plugin"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
