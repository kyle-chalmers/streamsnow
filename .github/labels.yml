# Labels as code. .github/workflows/labels.yml syncs this file to the repository on every
# push to main that touches it. Edit labels HERE, not in the GitHub UI: a UI edit is
# reverted on the next sync. `aliases` rename an existing label in place, so issues that
# carry GitHub's default `bug` keep it as `type:bug`.
#
# The triage agent (.github/workflows/claude-triage.yml) may only apply labels that exist
# in this file. CONTRIBUTING.md ("How issues move") explains what each status means.

# --- type: what kind of work -------------------------------------------------------------
- name: "type:bug"
  color: "d73a4a"
  description: "Something StreamSnow does wrong"
  aliases: ["bug"]
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or a change to existing behavior"
  aliases: ["enhancement"]
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
  aliases: ["documentation"]
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance: dependencies, CI, refactors with no behavior change"
- name: "type:question"
  color: "d876e3"
  description: "A question; usually belongs in Discussions"
  aliases: ["question"]
- name: "type:security"
  color: "b60205"
  description: "Possible vulnerability: report privately via SECURITY.md"

# --- area: which part of the codebase ----------------------------------------------------
- name: "area:cli"
  color: "c5def5"
  description: "streamsnow/cli.py and command wiring"
- name: "area:checks"
  color: "c5def5"
  description: "Governance checks (streamsnow/tools/check_*)"
- name: "area:review"
  color: "c5def5"
  description: "sql-review, review-gate, review-loop"
- name: "area:scaffold"
  color: "c5def5"
  description: "init/new/update and the repo/app templates"
- name: "area:deploy"
  color: "c5def5"
  description: "deploy-sql, deploy-setup, ci-key, verify-deploy"
- name: "area:preview"
  color: "c5def5"
  description: "Local preview and app navigation"
- name: "area:doctor"
  color: "c5def5"
  description: "doctor, configure and onboarding"
- name: "area:migrate"
  color: "c5def5"
  description: "migrate and /migrate-app"
- name: "area:skills"
  color: "c5def5"
  description: "Plugin skills (skills/)"
- name: "area:hooks"
  color: "c5def5"
  description: "Plugin hooks (hooks/)"
- name: "area:plugin"
  color: "c5def5"
  description: "Plugin/marketplace manifests, .mcp.json, agent-skills, packaging"
- name: "area:docs"
  color: "c5def5"
  description: "docs/ and README"
- name: "area:examples"
  color: "c5def5"
  description: "examples/"
- name: "area:ci"
  color: "c5def5"
  description: "This repository's own CI and automation (.github/)"
- name: "platform:windows"
  color: "bfdadc"
  description: "Specific to native Windows"

# --- priority ----------------------------------------------------------------------------
- name: "priority:p1"
  color: "b60205"
  description: "Broken for many users, or data/security risk"
- name: "priority:p2"
  color: "fbca04"
  description: "Real problem with a workaround"
- name: "priority:p3"
  color: "0e8a16"
  description: "Nice to have"

# --- status: where the issue is in its lifecycle -----------------------------------------
- name: "status:needs-triage"
  color: "ededed"
  description: "New; the triage agent has not labeled it yet"
- name: "status:needs-info"
  color: "fef2c0"
  description: "Waiting on the reporter; closes after 14 days without a reply"
- name: "status:needs-maintainer"
  color: "f9d0c4"
  description: "Needs a scope or design decision from the maintainer"
- name: "status:triaged"
  color: "c2e0c6"
  description: "Complete and in scope; a candidate for ready-for-agent"
- name: "ready-for-agent"
  color: "5319e7"
  description: "Maintainer-approved: an agent will implement this and open a PR"
- name: "status:agent-working"
  color: "d4c5f9"
  description: "An agent is implementing this"
- name: "status:blocked"
  color: "e99695"
  description: "Waiting on something outside this issue"
- name: "breaking-change"
  color: "b60205"
  description: "Changes the stable surface (docs/versioning.md); maintainer only"
- name: "digest"
  color: "ffffff"
  description: "The rolling maintainer digest issue"

# --- GitHub defaults kept as-is ----------------------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped, good for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "The maintainer would welcome a PR"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "Not a StreamSnow problem"
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope or declined; see the closing comment"
- name: "stale"
  color: "ededed"
  description: "Waiting on the reporter for 7+ days; closes after 7 more (stale.yml)"
