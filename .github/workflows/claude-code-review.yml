name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip PRs opened by the maintainer accounts and by bots; review everyone else.
    # claude-code-action refuses bot actors, and Dependabot runs get no repo secrets,
    # so a bot PR (dependency bumps) only ever showed this check as failed.
    # The exception is claude-implement's own PRs (branch agent/issue-N, opened and fixed
    # by the Claude GitHub App): the maintainer merges those, so they get a review first.
    # Dependabot PRs are reviewed by claude-autopilot instead.
    if: |
      (startsWith(github.event.pull_request.head.ref, 'agent/issue-') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.pull_request.user.login != 'kyle-chalmers' &&
       github.event.pull_request.user.login != 'kylechalmers-labs' &&
       github.event.pull_request.user.type != 'Bot')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only reachable for agent/issue-N branches (see `if` above).
          allowed_bots: 'claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

