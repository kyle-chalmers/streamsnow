name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (creates .venv with dev extras)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  privacy-gate:
    # Pre-publish gate: fail if any proprietary/internal term or secret leaks
    # into the OSS tree (the automated half; human review in RELEASING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.11 python -m streamsnow.tools.check_export_clean .

  wheel-smoke:
    # Build the wheel and run `streamsnow init` from the INSTALLED artifact, so
    # a packaging regression (e.g. templates excluded from the wheel) fails CI
    # rather than shipping a broken install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel into a clean venv
        run: |
          uv venv --python 3.11 /tmp/wheelenv
          uv pip install --python /tmp/wheelenv dist/*.whl
      - name: Smoke — init from the built wheel ships templates
        run: |
          /tmp/wheelenv/bin/streamsnow --version
          /tmp/wheelenv/bin/streamsnow init \
            --config streamsnow.config.example.yaml --dir /tmp/wheel-init --app smoke-app
          test -f /tmp/wheel-init/apps/smoke-app/streamlit_app.py
          test -f /tmp/wheel-init/AGENTS.md
          # Run the guardrail from inside the generated repo (config is discovered
          # from cwd) — proves the wheel ships templates AND the check works.
          cd /tmp/wheel-init && /tmp/wheelenv/bin/streamsnow check schema-refs apps

      # The sdist is only built at release time by publish.yml, so its contents were never
      # checked until the moment they shipped. The plugin-validate negative control relies on
      # an sdist exclude (pyproject: tool.hatch.build.targets.sdist), and a changed glob or a
      # hatchling behaviour change would otherwise surface as a published tarball containing
      # a deliberately malformed SKILL.md.
      - name: Sdist excludes the negative-control fixture
        run: |
          set -euo pipefail
          uv build --sdist
          sdist="$(ls dist/*.tar.gz)"
          # List once into a file rather than piping tar into grep. "grep -q" exits on its
          # first match and closes the pipe, which SIGPIPEs tar -- and under pipefail that
          # fails the step even though the check itself succeeded.
          listing="$(mktemp)"
          tar -tzf "$sdist" > "$listing"
          if grep -q 'plugin-validate-negative' "$listing"; then
            echo "::error::The negative-control fixture leaked into the sdist."
            grep 'plugin-validate-negative' "$listing"
            exit 1
          fi
          # Guard the guard: if tests/ stopped shipping entirely the check above would also
          # pass, and the exclude would look effective while proving nothing.
          grep -q '/tests/' "$listing"
          echo "sdist OK: fixture excluded, tests/ still present."

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned deliberately: this step executes the package, and its lifecycle scripts,
      # inside CI. An unpinned "npm install -g" lets an upstream release change what runs
      # here without review. Bump this together with the version check below.
      - name: Install Claude Code CLI 2.1.258 (pinned)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.258
          installed="$(claude --version)"
          case "$installed" in
            2.1.258*) echo "claude $installed" ;;
            *) echo "::error::Expected claude 2.1.258, got '$installed'"; exit 1 ;;
          esac

      # This repo is BOTH a plugin and a single-plugin marketplace. A root-directory target
      # resolves to marketplace.json in preference to plugin.json and never reads skills or
      # hooks, so the old "claude plugin validate . --strict" passed even with a garbage
      # SKILL.md. There is no flag to force plugin mode -- name each manifest explicitly.
      - name: Marketplace manifest (strict)
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Plugin manifest + skills + hooks (strict)
        run: claude plugin validate .claude-plugin/plugin.json --strict

      # Negative control: if this ever passes, the gate above has stopped reading skill
      # content and every green tick on it is meaningless. Runs against a throwaway tree.
      - name: "Negative control: corrupt skill must fail validation"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          # sort between find and head is deliberate: it consumes all of find's output, so
          # find is never SIGPIPEd by head closing early (which pipefail would treat as a
          # step failure). It also makes the choice of victim deterministic across runs.
          victim="$(find "$tmp/skills" -type f -name SKILL.md | sort | head -n 1)"
          test -f "$victim"
          cp tests/plugin-validate-negative/broken-SKILL.md "$victim"
          out="$tmp/validate.out"
          if claude plugin validate "$tmp/.claude-plugin/plugin.json" --strict >"$out" 2>&1; then
            echo "::error::Negative control PASSED. The plugin-validate gate is not reading skill content."
            cat "$out"
            exit 1
          fi
          # A non-zero exit is not enough on its own -- a missing file, a CLI error or any
          # unrelated validation failure would also be non-zero and would silently look like
          # proof. Require that it failed for THIS reason: naming the skill we corrupted, with
          # a frontmatter diagnostic.
          if ! grep -qF "${victim#"$tmp"/}" "$out"; then
            echo "::error::Validation failed but never named the corrupted skill -- wrong reason."
            cat "$out"
            exit 1
          fi
          if ! grep -qiE 'frontmatter|yaml' "$out"; then
            echo "::error::Validation failed without a frontmatter/YAML diagnostic -- wrong reason."
            cat "$out"
            exit 1
          fi
          echo "Negative control OK: corrupt frontmatter rejected, and the diagnostic named the skill."
