name: claude

# `@claude` on an issue or PR, e.g. "@claude scope this issue", "@claude address the review",
# "@claude CI is red, fix it", "@claude review" (for fork PRs, which claude-review skips).
#
# Only people with write access can trigger it: that is the action's default and is
# deliberately NOT relaxed here (no allowed_non_write_users), so outside users can neither
# spend the token nor steer an agent that can push.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on the PR
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip (no CLAUDE_CODE_OAUTH_TOKEN secret)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; @claude skipped."

      # Base-branch checkout (the default). The action switches to the PR branch itself for
      # same-repo PRs; fork code is never checked out into the workspace root here.
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - name: Install uv
        if: env.HAS_TOKEN == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Sync project
        if: env.HAS_TOKEN == 'true'
        run: uv sync --extra dev --python 3.11

      - name: Claude
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --append-system-prompt "Follow .claude/CLAUDE.md. Before pushing code, run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q -rs && uv run python -m streamsnow.tools.check_export_clean . On a fork PR, review the diff only: never run, install or import code from the PR."
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,TodoWrite,Bash(uv sync:*),Bash(uv run:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh search issues:*)"
